name: clean-and-upload

on:
  schedule:
    - cron: "20 2 * * *" # UTC 2:20 = 北京 10:20, 每天跑一次
  workflow_dispatch: {} # 手动触发（会强制同步一次）

permissions:
  contents: read

concurrency:
  group: clean-upload-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    # 放在 job 级, 这样步骤的 if 里能引用（secrets 不能直接写在 if 里）
    env:
      WORKER_URL: ${{ secrets.WORKER_URL }}
      DAV_USER: ${{ secrets.DAV_USER }}
      DAV_PASS: ${{ secrets.DAV_PASS }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      # Worker 中的指纹只随成功上传更新, 回退旧版本也能正确同步。
      - name: 清洗 data/ 下的链接文档
        if: env.WORKER_URL != ''
        run: python clean_links.py

      # data/ 里没有有效链接时 clean_links.py 不会生成 catalog.json，
      # 这里跳过上传，避免拿空目录 / 示例数据覆盖线上真实目录
      - name: 上传 catalog 到 Worker
        if: env.WORKER_URL != '' && hashFiles('catalog.json') != ''
        env:
          DATA_HASH: ${{ hashFiles('data/**', 'clean_links.py') }}
          FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FORCE_SYNC" = "true" ]; then
            python upload_catalog.py --source-hash "$DATA_HASH"
          else
            python upload_catalog.py --source-hash "$DATA_HASH" --if-changed
          fi

      - name: 提示（data/ 无有效链接）
        if: env.WORKER_URL != '' && hashFiles('catalog.json') == ''
        run: echo "::warning::data/ 里没有有效分享链接，已跳过上传（线上目录未改动）。要批量导入请把链接文档放进 data/"

      # ---- 死链体检：每天一轮，跟 data/ 有没有变无关 ----
      # 没配 Worker 地址就跳过，免得没配置的 fork 每天报红
      - name: 死链体检
        if: ${{ env.WORKER_URL != '' }}
        run: python check_links.py
